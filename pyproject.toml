[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascii-synth"
version = "0.1.0"
description = "A tiny terminal piano powered by pygame-ce."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pygame-ce>=2.5.8",
]

[project.urls]
Homepage = "https://github.com/noamtamir/ascii-synth"

[project.scripts]
asynth = "piano:main"

[tool.setuptools]
py-modules = ["piano"]
